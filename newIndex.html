<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>homepage</title>

    <!-- Google fonts -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <!-- Google fonts -->

    <!-- font awesome  -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <!-- font awesome  -->

    <!-- style sheet -->
    <link rel="stylesheet" href="style.css" />
    <!-- style sheet -->
  </head>
  <body>
    <!-- header section -->
    <header class="headerHP">

      <div class="logo">
        <a href="#">Logo</a>
      </div>
      <!-- logo -->

      <!-- website name  -->
      <div>
        <h1>Website Name</h1>
      </div>
      <!-- website name  -->

      <!-- search -->
      <div>
        <i class="fa-solid fa-magnifying-glass-minus"></i>
      </div>
      <!-- search -->

      <!-- button one  -->
      <div>
        <input type="checkbox" id="checked" />
        <label for="checked">
          <i class="fa-solid fa-bars"></i>
        </label>
      </div>
      <!-- button one  -->
    </header>
    <!-- header section ending -->

    <!-- main section  -->
    <main class="mainbox">
      <!-- sidebar section -->

      <!-- website name  -->
      <div>
        <a href="#">website name</a>
      </div>
      <!-- website name  -->

      <!-- button two  -->
      <div class="" btn_two>
        <label for="checked">
          <i class="fa-solid fa-xmark"></i>
        </label>
      </div>
      <!-- button two  -->

      <!-- menu -->
      <div class="menu">
        <ul>
          <li>
            <span class="material-symbols-outlined"> school </span>
            <a href="#">Semester</a>
          </li>
          <li>
            <span class="material-symbols-outlined"> computer </span>
            <a href="#">Subject</a>
          </li>
          <li>
            <span class="material-symbols-outlined"> auto_stories </span>
            <a href="#">Book Guide</a>
          </li>
          <li>
            <span class="material-symbols-outlined"> ink_pen </span>
            <a href="#">Notes Hub</a>
          </li>
          <li>
            <span class="material-symbols-outlined"> play_lesson </span>
            <a href="#">YouTube Picks</a>
          </li>
          <li>
            <span class="material-symbols-outlined"> list_alt_check </span>
            <a href="#">PYQ</a>
          </li>
          <li>
            <span class="material-symbols-outlined"> error </span>
            <a href="#">Senior Pitfalls</a>
          </li>
          <li>
            <span class="material-symbols-outlined"> mail </span>
            <a href="#">contact us</a>
          </li>
        </ul>
      </div>
      <!-- menu -->

      <!-- social media -->
      <div>
        <i class="fa-brands fa-square-instagram"></i>
        <i class="fa-brands fa-linkedin"></i>
        <i class="fa-brands fa-twitter"></i>
      </div>
      <!-- social media -->

      <!-- sidebar ending section -->

      <!-- button section -->
      <div class="btn">
        <!-- search -->
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" placeholder="Search..." />
        </div>
        <!-- subject button section -->
        <div class="sub_btn">
          <button>IKS</button>
          <button>DSA</button>
          <button>OOPs</button>
          <button>MATHS</button>
          <button>EVS</button>
        </div>
        <!-- subject button section -->
      </div>
      <!-- button section -->

      <!-- card section -->
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <!-- card section -->

      <!-- explore button -->
      <div class="exp_btn">
        <button>EXPLORE MORE</button>
      </div>
      <!-- explore button -->
    </main>
